<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Plexus">
  <title>Plexus</title>
  <!-- hex ring -->
  <path d="M50 16 L79.4 33 L79.4 67 L50 84 L20.6 67 L20.6 33 Z"
        stroke="#d8dde4" stroke-width="2.2" stroke-linejoin="round" opacity="0.42"/>
  <!-- amber spokes: hub to top / lower-left / lower-right -->
  <g stroke="#e0a44a" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="16"/>
    <line x1="50" y1="50" x2="79.4" y2="67"/>
    <line x1="50" y1="50" x2="20.6" y2="67"/>
  </g>
  <!-- ring nodes -->
  <g fill="#d8dde4">
    <circle cx="50" cy="16" r="4.6"/>
    <circle cx="79.4" cy="33" r="4.6"/>
    <circle cx="79.4" cy="67" r="4.6"/>
    <circle cx="50" cy="84" r="4.6"/>
    <circle cx="20.6" cy="67" r="4.6"/>
    <circle cx="20.6" cy="33" r="4.6"/>
  </g>
  <!-- amber hub -->
  <circle cx="50" cy="50" r="12" fill="#e0a44a" opacity="0.16"/>
  <circle cx="50" cy="50" r="7" fill="#e0a44a"/>
</svg>
